<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paths — Drill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="drill-app paths-page">
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">D</span>
            <span class="brand-name">Drill</span>
        </a>
        <nav class="topnav">
            <a href="/">Today</a>
            <a href="/practice">Practice</a>
            <a href="/paths" class="active">Paths</a>
        </nav>
        <div class="topbar-meta">Browse patterns</div>
    </header>

    <main class="paths-shell">
        <aside class="paths-nav" id="nav"></aside>
        <section class="paths-detail" id="detail">
            <div class="detail-placeholder">
                <p class="eyebrow">Paths</p>
                <h1>Pick a pattern to see how it fits.</h1>
                <p>Each pattern belongs to a skill. Skills roll up into bigger training blocks. Click anything — you’ll always see the plain-English explanation and the problems that train it.</p>
            </div>
        </section>
    </main>

    <script>
        const API = window.location.origin;
        const FOCUS = {{ focus_method|tojson }};
        let tree = null, states = {};

        const esc = (s) => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

        async function boot() {
            const [t, s] = await Promise.all([
                fetch(`${API}/api/skills/tree`).then(r => r.json()),
                fetch(`${API}/api/learn/states`).then(r => r.json()),
            ]);
            tree = t;
            states = s.methods || {};
            renderNav();
            if (FOCUS) showMethod(FOCUS);
            else if (tree.pillars?.[0]?.skills?.[0]?.methods?.[0]) {
                showMethod(tree.pillars[0].skills[0].methods[0].id);
            }
        }

        function renderNav() {
            const nav = document.getElementById('nav');
            nav.innerHTML = tree.pillars.map(p => `
                <div class="path-group">
                    <h2>${esc(p.name)}</h2>
                    ${p.skills.map(sk => `
                        <div class="path-skill">
                            <button type="button" class="skill-btn" data-skill="${sk.id}">${esc(sk.name)}</button>
                            ${sk.methods.map(m => {
                                const st = states[m.id] || {};
                                const pct = Math.round((st.stability || 0) * 100);
                                return `<button type="button" class="method-btn" data-method="${m.id}">
                                    <span>${esc(m.name)}</span>
                                    <em>${st.due ? 'ready' : pct + '%'}</em>
                                </button>`;
                            }).join('')}
                        </div>
                    `).join('')}
                </div>
            `).join('');
            nav.querySelectorAll('[data-method]').forEach(b => b.onclick = () => showMethod(b.dataset.method));
            nav.querySelectorAll('[data-skill]').forEach(b => b.onclick = () => showSkill(b.dataset.skill));
        }

        function highlight(methodId) {
            document.querySelectorAll('.method-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.method === methodId));
        }

        async function showMethod(mid) {
            highlight(mid);
            history.replaceState(null, '', `/paths/${mid}`);
            const data = await fetch(`${API}/api/skills/methods/${mid}`).then(r => r.json());
            const m = data.method;
            const parent = (data.parents || [])[0];
            document.getElementById('detail').innerHTML = `
                <article class="detail-card reveal">
                    ${parent ? `<p class="breadcrumb"><a href="#" id="up-skill">${esc(parent.skill.name)}</a> / ${esc(m.name)}</p>` : ''}
                    <p class="eyebrow">Pattern</p>
                    <h1>${esc(m.name)}</h1>
                    <p class="lede">${esc(m.summary)}</p>
                    <h2>Remember these</h2>
                    <ol>${(m.form_cues||[]).map(c => `<li>${esc(c)}</li>`).join('')}</ol>
                    <h2>Problems that train this</h2>
                    <ul class="rep-list-ul">
                        ${(data.questions||[]).map(q => `
                            <li><a href="/practice/${q.id}">
                                <span>${esc(q.title)}</span>
                                <span class="diff-dot diff-${q.difficulty.toLowerCase()}">${esc(q.difficulty)}</span>
                            </a></li>`).join('')}
                    </ul>
                    <div class="cta-row">
                        <a class="primary-btn" href="/?focus=${encodeURIComponent(mid)}">Study this in Today</a>
                        ${(data.questions||[])[0] ? `<a class="ghost-btn" href="/practice/${data.questions[0].id}">Practice a problem</a>` : ''}
                    </div>
                    ${(data.notes||[]).length ? `
                        <h2>Your notes</h2>
                        <div class="technique-notes">
                            ${data.notes.map(n => `<article class="note-card"><p>${esc(n.text)}</p></article>`).join('')}
                        </div>` : ''}
                </article>`;
            const up = document.getElementById('up-skill');
            if (up && parent) up.onclick = (e) => { e.preventDefault(); showSkill(parent.skill.id); };
        }

        async function showSkill(sid) {
            history.replaceState(null, '', `/paths`);
            const data = await fetch(`${API}/api/skills/skills/${sid}`).then(r => r.json());
            document.getElementById('detail').innerHTML = `
                <article class="detail-card reveal">
                    <p class="eyebrow">${esc(data.pillar.name)}</p>
                    <h1>${esc(data.skill.name)}</h1>
                    <p class="lede">${esc(data.skill.description)}</p>
                    <h2>Patterns inside</h2>
                    <div class="chip-row">
                        ${(data.methods||[]).map(m => `
                            <button type="button" class="method-chip primary" data-go="${m.id}">
                                <span>${esc(m.name)}</span>
                                <small>${m.question_count} problems</small>
                            </button>`).join('')}
                    </div>
                </article>`;
            document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => showMethod(b.dataset.go));
        }

        boot();
    </script>
</body>
</html>
